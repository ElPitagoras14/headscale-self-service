name: release

on:
  push:
    branches: [main]

# Una ejecucion a la vez: dos pushes seguidos no publican la misma version a la vez
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: gate
        run: bash .github/scripts/version-gate.sh

  publish:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Los RUN del Dockerfile corren en la arquitectura destino: arm64 necesita QEMU
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action pasa el nombre a minusculas, que es lo que exige GHCR
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # El tag lo crea el release, solo cuando la imagen ya esta publicada
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes

  deploy:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DOKPLOY_URL: https://dokploy.elpitagoras14.qzz.io
    steps:
      # El release ya creo el tag: si el deploy falla, la version no se quema y
      # basta con relanzar este job (Re-run failed jobs)
      - name: Deploy to Dokploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$COMPOSE_ID" ]; then
            echo "::error::Faltan el secret DOKPLOY_API_KEY o la variable DOKPLOY_COMPOSE_ID"
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST \
            "$DOKPLOY_URL/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"composeId\":\"$COMPOSE_ID\",\"title\":\"Deployment v$VERSION\",\"description\":\"Automatic deployment from GitHub Actions\"}"
